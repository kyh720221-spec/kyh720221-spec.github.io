<style>:root{--bg:#12111c;--card:#1d1b2e;--card2:#26233d;--txt:#ece9ff;--mut:#9a94c4;--acc:#8b5cf6;--gold:#fbbf24;--ok:#22c55e;--bad:#ef4444}
body.light{--bg:#f4f2fb;--card:#fff;--card2:#ece8fa;--txt:#1d1b2e;--mut:#6b6690}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;padding-bottom:80px;font-size:15px}
#hero{padding:16px 16px 12px;background:linear-gradient(135deg,#3b1d7a,#1d1b2e);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0006}
.hrow{display:flex;align-items:center;gap:12px}.lvbadge{width:54px;height:54px;border-radius:14px;background:radial-gradient(circle,#fbbf24,#b45309);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#1d1b2e;box-shadow:0 0 14px #fbbf2488}
.lvbadge small{font-size:10px}.lvbadge b{font-size:22px;line-height:1}
.bar{height:10px;background:#0005;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#f472b6);border-radius:6px;transition:width .5s}
.mut{color:var(--mut);font-size:12px}
main{padding:12px}.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #ffffff10}
h2{font-size:16px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--card2);margin-bottom:8px}
.chk{width:32px;height:32px;border-radius:10px;border:2px solid var(--acc);background:none;color:#fff;font-size:18px;flex:none;cursor:pointer}
.item.done .chk{background:var(--acc)}.item.done .t{text-decoration:line-through;opacity:.6}
.item .t{flex:1;min-width:0}.tag{font-size:11px;padding:2px 7px;border-radius:8px;background:#8b5cf633;color:#c4b5fd;margin-right:4px}
.streak{color:var(--gold);font-size:12px;font-weight:700}
.x{background:none;border:none;color:var(--mut);font-size:16px;cursor:pointer}
button.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
button.btn.sec{background:var(--card2);color:var(--txt)}button.sm{padding:5px 10px;font-size:12px}
input,select{background:var(--card2);color:var(--txt);border:1px solid #ffffff22;border-radius:10px;padding:9px;font-size:15px;width:100%}
.memo{display:flex;gap:6px;align-items:center}.memo input{font-size:13px;padding:7px;opacity:.85}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid #ffffff15;padding-bottom:env(safe-area-inset-bottom);z-index:6}
#nav button{flex:1;background:none;border:none;color:var(--mut);padding:8px 0;font-size:20px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
#nav button span{font-size:11px;margin-top:2px}#nav button.on{color:var(--acc)}
.stat{display:flex;gap:10px;align-items:center;margin-bottom:12px}.stat .ic{font-size:26px;width:40px;text-align:center}.stat .s{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ach{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center;font-size:11px}
.ach .e{font-size:28px;display:block}.ach.lock{opacity:.3;filter:grayscale(1)}
canvas{width:100%;height:180px;display:block}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1}
#toasts{position:fixed;top:12px;left:12px;right:12px;z-index:20;pointer-events:none}
.toast{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;padding:12px 14px;border-radius:12px;margin-bottom:8px;font-weight:700;box-shadow:0 4px 20px #0008;animation:pop .4s}
.toast.lv{background:linear-gradient(135deg,#f59e0b,#b45309);font-size:18px;text-align:center}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.flash{animation:flash .8s}@keyframes flash{0%,100%{box-shadow:0 0 14px #fbbf2488}50%{box-shadow:0 0 40px #fbbf24;transform:scale(1.15)}}
.xpf{position:fixed;color:var(--gold);font-weight:800;pointer-events:none;animation:up 1s forwards;z-index:30}@keyframes up{to{transform:translateY(-50px);opacity:0}}
#modal{position:fixed;inset:0;background:#000a;z-index:15;display:flex;align-items:flex-end}#modal.hidden{display:none}
#modal .sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px;display:flex;flex-direction:column;gap:10px}
label{font-size:12px;color:var(--mut)}.row{display:flex;gap:8px}.row>*{flex:1}
.prog{font-size:12px;color:var(--mut)}.empty{color:var(--mut);text-align:center;padding:10px;font-size:13px}
#syncIcon{font-size:20px;min-width:24px;text-align:center;cursor:pointer}.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast.upd{pointer-events:auto;cursor:pointer;background:linear-gradient(135deg,#0ea5e9,#6366f1)}
#fYs{margin:0}
.banner{background:linear-gradient(135deg,#312e81,#1d1b2e);border:1px solid #fbbf2455;border-radius:14px;padding:10px 12px;margin-bottom:12px;cursor:pointer}
.bn{font-size:14px;padding:3px 0}.bn b{color:var(--gold);margin-right:6px}.bn.d7 b{color:var(--bad)}
.item.ev .dd{font-size:13px;color:var(--mut);white-space:nowrap}.item.ev.d30{border-left:3px solid var(--gold)}.item.ev.d30 .dd{color:var(--gold)}
.item.ev.d7{border-left:3px solid var(--bad);background:#ef444418}.item.ev.d7 .dd{color:var(--bad)}
.item.ivover{border-left:3px solid var(--bad)}
#tseg .btn{padding:9px 4px}
</style>
</head><body>
<header id="hero"></header>
<main>
<section id="tab-today" class="tab active"></section>
<section id="tab-stats" class="tab"></section>
<section id="tab-quests" class="tab"></section>
<section id="tab-charts" class="tab"></section>
<section id="tab-settings" class="tab"></section>
</main>
<nav id="nav">
<button data-tab="today" class="on">⚔️<span>오늘</span></button>
<button data-tab="stats">📊<span>능력치</span></button>
<button data-tab="quests">🏆<span>퀘스트</span></button>
<button data-tab="charts">📈<span>통계</span></button>
<button data-tab="settings">⚙️<span>설정</span></button>
</nav>
<div id="toasts"></div><div id="modal" class="hidden"></div>
<script>'use strict';
const APP_VERSION='1.2.3';
const KEY='levelup-life-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const DAY_START_HOUR=5;// 하루 시작(초기화) 시각: 오전 5시. 00:00~04:59는 전날로 취급
const dayNow=(t=Date.now())=>new Date(t-DAY_START_HOUR*36e5);
const today=()=>dkey(dayNow());
const fmtDay=k=>{const d=new Date(k+'T12:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일('+'일월화수목금토'[d.getDay()]+')'};
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function defaults(){
  const st=[['str','체력','💪'],['int','지식','📚'],['mnd','정신','🧘'],['life','생활','🏠'],['rel','관계','🤝']].map(([id,name,icon])=>({id,name,icon}));
  const it=[['물 2L 마시기','str',10],['30분 운동','str',20],['독서 20쪽','int',15],['명상 5분','mnd',10],['방 정리','life',10],['가족·친구에게 연락','rel',15]].map(([title,stat,xp])=>({id:uid(),title,stat,xp,type:'habit'}));
  it.push({id:uid(),title:'이번 주 장보기',stat:'life',xp:15,type:'todo',done:null});
  it.push({id:uid(),title:'운동 3회',stat:'str',xp:40,type:'weekly',target:3},{id:uid(),title:'다음 주 계획 세우기',stat:'mnd',xp:40,type:'weekly',target:1});
  it.push({id:uid(),title:'책 1권 완독',stat:'int',xp:100,type:'monthly',target:1},{id:uid(),title:'가계부 결산',stat:'life',xp:100,type:'monthly',target:1});
  return {v:1,stats:st,items:it,log:{},rewards:[],quests:[{id:uid(),title:'이번 달 운동 10회',stat:'str',item:null,period:'month',target:10,reward:100,claimed:{}}],ach:{},prog:{},events:[],theme:'dark'};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.stats)S=defaults();
if(!S.meta)S.meta={lastModified:0};
function migrate(o){if(!o.prog)o.prog={};if(!Array.isArray(o.events))o.events=[];for(const i of o.items||[]){if(!i.type)i.type='habit';if(i.type==='interval'){i.every=Math.max(1,+i.every||1);if(!i.due)i.due=today()}if((i.type==='weekly'||i.type==='monthly')&&!(i.target>=1))i.target=1}return o}

// 레벨 곡선: 초반 빠르게, 후반 점점 느리게
const need=l=>Math.round(40+20*Math.pow(l-1,1.45));
function lvl(xp){let l=1;while(xp>=need(l)){xp-=need(l);l++}return {l,cur:xp,need:need(l)}}
const statLvl=xp=>lvl(xp*2); // 능력치 레벨은 단일 스탯 xp 기준으로 조금 빠르게

function dayLog(k){return S.log[k]||(S.log[k]={checks:[],memo:''})}
function totals(){
  const st={};S.stats.forEach(s=>st[s.id]=0);let total=0,checks=0;
  for(const k in S.log)for(const c of S.log[k].checks){st[c.stat]=(st[c.stat]||0)+c.xp;total+=c.xp;checks++}
  for(const r of S.rewards){total+=r.xp;if(r.stat)st[r.stat]=(st[r.stat]||0)+r.xp}
  return {st,total,checks};
}
function isChecked(id,k=today()){return (S.log[k]?.checks||[]).some(c=>c.id===id)}
function streak(id){let k=today();if(!isChecked(id,k))k=addDays(k,-1);let n=0;while(isChecked(id,k)){n++;k=addDays(k,-1)}return n}
const PER={weekly:'week',monthly:'month'};
const isPer=i=>i.type==='weekly'||i.type==='monthly';
function pkOf(i,k=today()){return periodKey(PER[i.type],k)}
function prevPk(i,pk){if(i.type==='weekly')return 'W'+addDays(pk.slice(1),-7);let [y,m]=pk.split('-').map(Number);m--;if(!m){m=12;y--}return y+'-'+pad(m)}
const cnt=(i,pk=pkOf(i))=>(S.prog[i.id]||{})[pk]||0;
const perDone=(i,pk=pkOf(i))=>cnt(i,pk)>=(i.target||1);
function perStreak(i){let pk=pkOf(i);if(!perDone(i,pk))pk=prevPk(i,pk);let n=0;while(perDone(i,pk)&&n<999){n++;pk=prevPk(i,pk)}return n}
function bestPer(t){return Math.max(0,...S.items.filter(i=>i.type===t).map(perStreak))}
function perInfo(t){const k=today(),d=new Date(k+'T12:00:00');if(t==='weekly'){const mon=addDays(k,-((d.getDay()+6)%7)),sun=addDays(mon,6);const f=x=>(+x.slice(5,7))+'/'+(+x.slice(8));return {label:f(mon)+'~'+f(sun),left:(new Date(sun+'T12:00:00')-d)/864e5+1}}
 const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return {label:(d.getMonth()+1)+'월',left:last-d.getDate()+1}}
function bestStreak(){return Math.max(0,...S.items.filter(i=>i.type==='habit').map(i=>streak(i.id)))}
function anyStreakDays(){let k=today();if(!(S.log[k]?.checks.length))k=addDays(k,-1);let n=0;while(S.log[k]?.checks.length){n++;k=addDays(k,-1)}return n}

const ACH=[
 ['first','🌱','첫 체크',()=>totals().checks>=1],
 ['c50','✅','체크 50회',()=>totals().checks>=50],
 ['c200','💯','체크 200회',()=>totals().checks>=200],
 ['s3','🔥','3일 연속',()=>bestStreak()>=3],
 ['s7','⚡','7일 연속',()=>bestStreak()>=7],
 ['s30','👑','30일 연속',()=>bestStreak()>=30],
 ['l5','⭐','레벨 5',()=>lvl(totals().total).l>=5],
 ['l10','🌟','레벨 10',()=>lvl(totals().total).l>=10],
 ['l20','💫','레벨 20',()=>lvl(totals().total).l>=20],
 ['all','🎯','하루 올클리어',()=>{const h=S.items.filter(i=>i.type==='habit');return h.length>0&&h.every(i=>isChecked(i.id))}],
 ['quest','🏅','첫 퀘스트 완료',()=>S.rewards.some(r=>r.src==='quest')],
 ['w1','📅','첫 주간 완주',()=>S.items.some(i=>i.type==='weekly'&&Object.keys(S.prog[i.id]||{}).some(pk=>perDone(i,pk)))],
 ['m1','🗓️','첫 월간 완주',()=>S.items.some(i=>i.type==='monthly'&&Object.keys(S.prog[i.id]||{}).some(pk=>perDone(i,pk)))],
 ['w4','🔥','4주 연속 주간 완주',()=>bestPer('weekly')>=4],
 ['memo','✏️','한 줄 메모 7일',()=>Object.values(S.log).filter(l=>l.memo).length>=7],
];
function periodKey(p,k=today()){if(p==='month')return k.slice(0,7);if(p==='week'){const d=new Date(k+'T12:00:00');const m=addDays(k,-((d.getDay()+6)%7));return 'W'+m}return 'all'}
function inPeriod(p,k){return p==='all'||periodKey(p,k)===periodKey(p)}
function questProg(q){let n=0;for(const k in S.log){if(!inPeriod(q.period,k))continue;for(const c of S.log[k].checks)if(q.item?c.id===q.item:(!q.stat||c.stat===q.stat))n++}return n}

function toast(msg,cls=''){const t=document.createElement('div');t.className='toast '+cls;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2600)}
function floatXP(el,txt){const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='xpf';f.textContent=txt;f.style.left=r.left+'px';f.style.top=r.top+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}

function evaluate(before){
  // 퀘스트 보상
  for(const q of S.quests){const pk=periodKey(q.period);if(!q.claimed[pk]&&questProg(q)>=q.target){q.claimed[pk]=today();S.rewards.push({date:today(),xp:q.reward,stat:q.stat||null,src:'quest',id:q.id});toast('🏅 퀘스트 완료! '+q.title+' +'+q.reward+'XP')}}
  for(const [id,e,name,fn] of ACH){if(!S.ach[id]&&fn()){S.ach[id]=today();S.rewards.push({date:today(),xp:20,stat:null,src:'ach',id});toast(e+' 업적 달성: '+name+' (+20XP)')}}
  const after=totals();
  const L0=lvl(before.total).l,L1=lvl(after.total).l;
  if(L1>L0){toast('🎉 LEVEL UP! Lv.'+L1,'lv');setTimeout(()=>$('.lvbadge')?.classList.add('flash'),50)}
  for(const s of S.stats){const a=statLvl(before.st[s.id]||0).l,b=statLvl(after.st[s.id]||0).l;if(b>a)toast(s.icon+' '+s.name+' Lv.'+b+' 달성!')}
  save();render();
}
function bump(id,delta,el){
  const it=S.items.find(i=>i.id===id);const before=totals();const pk=pkOf(it),p=S.prog[id]||(S.prog[id]={});
  const was=perDone(it,pk);p[pk]=Math.max(0,Math.min(it.target||1,(p[pk]||0)+delta));const now=perDone(it,pk);
  if(now&&!was){dayLog(today()).checks.push({id,stat:it.stat,xp:it.xp,per:pk});if(el)floatXP(el,'+'+it.xp+' XP');toast('✅ '+it.title+' 완주!')}
  if(was&&!now){for(const k in S.log){const c=S.log[k].checks,ix=c.findIndex(x=>x.id===id&&x.per===pk);if(ix>=0){c.splice(ix,1);break}}}
  evaluate(before);
}
function toggleIv(it,el){const before=totals(),k=today();
 if(it.lastDone===k&&it.prevDue){for(const d in S.log){const c=S.log[d].checks,ix=c.findIndex(x=>x.id===it.id&&x.iv);if(d===k&&ix>=0){c.splice(ix,1);break}}it.due=it.prevDue;it.lastDone=it.prevDone||null;delete it.prevDue}
 else{dayLog(k).checks.push({id:it.id,stat:it.stat,xp:it.xp,iv:it.due});it.prevDue=it.due;it.prevDone=it.lastDone||null;it.lastDone=k;let d=addDays(it.due,it.every);while(d<=k)d=addDays(d,it.every);it.due=d;floatXP(el,'+'+it.xp+' XP')}
 evaluate(before)}
function toggle(id,el){
  const it=S.items.find(i=>i.id===id);if(it.type==='interval')return toggleIv(it,el);if(isPer(it))return bump(id,perDone(it)?-(it.target||1):1,el);const before=totals();const L=dayLog(today());
  const ix=L.checks.findIndex(c=>c.id===id);
  if(ix>=0){L.checks.splice(ix,1);if(it.type==='todo')it.done=null}
  else{L.checks.push({id,stat:it.stat,xp:it.xp});if(it.type==='todo')it.done=today();floatXP(el,'+'+it.xp+' XP')}
  evaluate(before);
}

 const lab=days.map(k=>chartMode==='week'?['일','월','화','수','목','금','토'][new Date(k+'T12:00:00').getDay()]:(+k.slice(8)));

function bar(id,labels,vals,color){const cv=document.getElementById(id);const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
 const cs=getComputedStyle(document.body),mut=cs.getPropertyValue('--mut');const max=Math.max(1,...vals),pl=26,pb=20,cw=(W-pl)/vals.length;
 g.font='10px sans-serif';g.fillStyle=mut;g.strokeStyle=mut+'44';
 for(let i=0;i<=2;i++){const y=8+(H-pb-8)*i/2;g.globalAlpha=.3;g.beginPath();g.moveTo(pl,y);g.lineTo(W,y);g.stroke();g.globalAlpha=1;g.fillText(Math.round(max*(1-i/2)),0,y+3)}
 vals.forEach((v,i)=>{const h=(H-pb-8)*v/max,x=pl+i*cw+cw*.18,w=cw*.64;const gr=g.createLinearGradient(0,H-pb-h,0,H-pb);gr.addColorStop(0,color);gr.addColorStop(1,color+'55');g.fillStyle=gr;g.beginPath();(g.roundRect?g.roundRect(x,H-pb-h,w,h,3):g.rect(x,H-pb-h,w,h));g.fill();
  g.fillStyle=mut;g.textAlign='center';if(vals.length<=10||i%5===4)g.fillText(labels[i],x+w/2,H-6);g.textAlign='left'});
}

 $('#exp').onclick=exportData;$('#imp').onclick=()=>$('#file').click();
 $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>importData(t))};
 $('#reset').onclick=()=>{if(confirm('정말 모든 기록을 지울까요? 되돌릴 수 없어요.')){S=Object.assign(defaults(),{meta:S.meta});save();render();toast('초기화했어요')}};
}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='levelup-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('백업 파일을 저장했어요')}
function importData(t){try{const d=JSON.parse(t);if(!d.stats||!d.items||!d.log)throw 0;S=migrate(Object.assign(defaults(),{prog:{}},d,{meta:S.meta}));lastBody='';save();render();toast('불러오기 완료!')}catch(e){alert('올바른 백업 파일이 아니에요')}}
window.LU={exportData,importData,get S(){return S},totals,lvl,replaceState,save,render:()=>render(),toast,today};

function sheet(html,onok){const m=$('#modal');m.innerHTML=`<div class="sheet">${html}<div class="row"><button class="btn sec" id="mc">취소</button><button class="btn" id="mo">저장</button></div></div>`;m.classList.remove('hidden');
 const close=()=>m.classList.add('hidden');$('#mc').onclick=close;m.onclick=e=>{if(e.target===m)close()};$('#mo').onclick=()=>{if(onok()!==false)close()};}
const statOpts=sel=>S.stats.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${s.icon} ${esc(s.name)}</option>`).join('');
function editItem(id,mode){const DX={habit:10,weekly:40,monthly:100,todo:15,interval:20};const ty0=mode||'habit';
 const it=S.items.find(i=>i.id===id)||{title:'',stat:S.stats[0]?.id,xp:DX[ty0],type:ty0,target:1};
 const xps=[5,10,15,20,30,40,50,80,100,150,200];if(!xps.includes(+it.xp))xps.push(+it.xp);
 sheet(`<h2>${id?'수정':'새 항목'}</h2><label>이름</label><input id="fT" value="${esc(it.title)}" placeholder="예: 스트레칭 10분"><label>주기</label><div class="seg" id="fYs">${[['habit','매일'],['weekly','매주'],['monthly','매월'],['interval','N일마다'],['todo','한 번']].map(([v,n])=>`<button type="button" class="btn sm ${it.type===v?'':'sec'}" data-ty="${v}">${n}</button>`).join('')}</div>
 <div class="row"><div><label>능력치</label><select id="fS">${statOpts(it.stat)}</select></div><div><label>XP</label><select id="fX">${xps.sort((a,b)=>a-b).map(v=>`<option ${v==it.xp?'selected':''}>${v}</option>`).join('')}</select></div><div id="fNw"><label>목표 횟수</label><input id="fN" type="number" min="1" max="99" value="${it.target||1}"></div></div><div class="row" id="fIw"><div><label>며칠마다</label><input id="fE" type="number" min="1" max="3650" value="${it.every||7}"></div><div><label>${id?'다음 날짜':'시작 날짜'}</label><input id="fSd" type="date" value="${it.due||today()}"></div></div><div class="mut" id="fHint"></div>${id?'<button class="btn sec" id="fD" style="color:var(--bad)">🗑 삭제</button>':''}`,()=>{
  const t=$('#fT').value.trim();if(!t)return false;const ty=$('#fYs').dataset.v;const oldT=it.type;
  Object.assign(it,{title:t,type:ty,stat:$('#fS').value,xp:+$('#fX').value});if(isPer(it))it.target=Math.max(1,Math.min(99,+$('#fN').value||1));if(ty==='interval'){it.every=Math.max(1,Math.min(3650,+$('#fE').value||1));it.due=$('#fSd').value||today()}
  if(!id){it.id=uid();if(it.type==='todo')it.done=null;S.items.push(it)}else if(oldT!==ty&&it.type==='todo')it.done=null;todayMode=it.type==='todo'?todayMode:it.type;save();render()});
 const setTy=(v,user)=>{$('#fYs').dataset.v=v;document.querySelectorAll('[data-ty]').forEach(b=>b.classList.toggle('sec',b.dataset.ty!==v));$('#fNw').style.display=(v==='weekly'||v==='monthly')?'':'none';$('#fIw').style.display=v==='interval'?'':'none';
  $('#fHint').textContent={habit:'매일 오전 5시에 초기화돼요',weekly:'매주 월요일에 초기화 · 목표 2회 이상이면 +1 카운터',monthly:'매달 1일에 초기화 · 목표 2회 이상이면 +1 카운터',todo:'한 번 완료하면 끝나요',interval:'시작 날짜부터 N일마다 나타나요 · 체크하면 다음 날짜로 넘어가요'}[v];
  if(user&&!id)$('#fX').value=String(DX[v])};
 setTy(it.type);document.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>setTy(b.dataset.ty,true));
 if(id)$('#fD').onclick=()=>{if(confirm('삭제할까요? (이미 얻은 XP는 유지)')){S.items=S.items.filter(i=>i.id!==id);save();render();$('#modal').classList.add('hidden')}};
}
function editStat(id){const s=S.stats.find(x=>x.id===id)||{name:'',icon:'✨'};
 sheet(`<h2>${id?'능력치 수정':'새 능력치'}</h2><div class="row"><div style="flex:0 0 70px"><label>아이콘</label><input id="sI" value="${esc(s.icon)}" maxlength="4"></div><div><label>이름</label><input id="sN" value="${esc(s.name)}"></div></div>${id&&S.stats.length>1?'<button class="btn sec" id="sD" style="color:var(--bad)">🗑 삭제</button>':''}`,()=>{
  const n=$('#sN').value.trim();if(!n)return false;s.name=n;s.icon=$('#sI').value.trim()||'✨';if(!id){s.id=uid();S.stats.push(s)}save();render()});
 if(id&&S.stats.length>1)$('#sD').onclick=()=>{if(confirm('능력치를 삭제할까요?')){S.stats=S.stats.filter(x=>x.id!==id);const f=S.stats[0].id;S.items.forEach(i=>{if(i.stat===id)i.stat=f});save();render();$('#modal').classList.add('hidden')}};
}
function editQuest(){
 sheet(`<h2>새 퀘스트</h2><label>이름</label><input id="qT" placeholder="예: 이번 달 달리기 10번"><label>대상</label><select id="qW"><optgroup label="능력치 전체">${statOpts()}</optgroup><optgroup label="특정 항목">${S.items.map(i=>`<option value="i:${i.id}">${esc(i.title)}</option>`).join('')}</optgroup></select><div class="row"><div><label>기간</label><select id="qP"><option value="week">매주</option><option value="month" selected>매월</option><option value="all">누적</option></select></div><div><label>목표 횟수</label><input id="qN" type="number" value="10" min="1"></div><div><label>보상 XP</label><input id="qR" type="number" value="100" min="0"></div></div>`,()=>{
  const t=$('#qT').value.trim(),w=$('#qW').value;if(!t)return false;const isI=w.startsWith('i:');const it=isI?S.items.find(i=>i.id===w.slice(2)):null;
  S.quests.push({id:uid(),title:t,item:it?it.id:null,stat:it?it.stat:w,period:$('#qP').value,target:Math.max(1,+$('#qN').value||1),reward:Math.max(0,+$('#qR').value||0),claimed:{}});
  const b=totals();evaluate(b)});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='evchk')return toggleEv(b.closest('.item').dataset.ev,b);if(b.dataset.act==='evedit')return editEv(b.closest('.item').dataset.ev);const id=b.closest('.item').dataset.id;if(b.dataset.act==='chk')toggle(id,b);else if(b.dataset.act==='inc')bump(id,1,b);else if(b.dataset.act==='dec')bump(id,-1,b);else editItem(id)});
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id==='tab-'+b.dataset.tab));if(b.dataset.tab==='charts')renderCharts();scrollTo(0,0)});
function render(){document.body.classList.toggle('light',S.theme==='light');renderHero();renderToday();renderStats();renderQuests();if($('#tab-charts').classList.contains('active'))renderCharts();renderSettings()}
render();save();
window.LUSync&&LUSync.start();
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
 const had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.register('sw.js').then(r=>r.update().catch(()=>{})).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;const t=document.createElement('div');t.className='toast upd';t.id='updToast';t.textContent='✨ 새 버전이 있어요 · 눌러서 새로고침';t.onclick=()=>location.reload();$('#toasts').appendChild(t)});
}
</script>
</body></html>
